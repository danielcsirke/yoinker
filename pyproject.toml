[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yoinker"
version = "1.0.0"
description = "A very simple window for downloading videos and music. Paste a link, press the button."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Csirke" }]
dependencies = [
    "yt-dlp>=2025.1.1",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.0"]

[project.gui-scripts]
yoinker = "yoinker.app:main"

[project.urls]
Homepage = "https://github.com/danielcsirke/yoinker"
Downloads = "https://github.com/danielcsirke/yoinker/releases/latest"

[tool.setuptools.packages.find]
include = ["yoinker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
