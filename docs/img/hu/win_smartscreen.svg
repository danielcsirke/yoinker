<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="560" height="400" fill="#0078d4"/>
  <text x="34" y="70" font-size="26" fill="#fff">A Windows megvédte a számítógépet</text>
  <text x="34" y="112" font-size="14" fill="#fff">A Microsoft Defender SmartScreen megakadályozta egy ismeretlen alkalmazás</text>
  <text x="34" y="134" font-size="14" fill="#fff">indítását. Az alkalmazás futtatása kockázatos lehet.</text>
  <text x="34" y="174" font-size="14" fill="#fff" text-decoration="underline" font-weight="bold">További információ</text>
  <rect x="26" y="156" width="150" height="28" rx="4" fill="none" stroke="#ffd400" stroke-width="3"/>
  <circle cx="200" cy="170" r="16" fill="#ffd400"/><text x="200" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">1</text>

  <text x="34" y="222" font-size="14" fill="#fff">Alkalmazás:  Yoinker-Windows.exe</text>
  <text x="34" y="244" font-size="14" fill="#fff">Kiadó:  Ismeretlen kiadó</text>

  <rect x="292" y="330" width="150" height="40" fill="#fff" stroke="#ccc"/>
  <text x="367" y="356" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Futtatás mindenképp</text>
  <rect x="286" y="324" width="162" height="52" rx="4" fill="none" stroke="#ffd400" stroke-width="3"/>
  <circle cx="470" cy="350" r="16" fill="#ffd400"/><text x="470" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">2</text>
  <rect x="455" y="330" width="90" height="40" fill="#e6e6e6" stroke="#ccc"/>
  <text x="500" y="356" text-anchor="middle" font-size="15" fill="#222">Ne futtassa</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#dbe9f7">Illusztráció – a te gépeden pontosan ugyanez a két szöveg lesz</text>
</svg>
