<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="560" height="420" fill="#f0f0f0"/>
  <!-- step 1: right click menu -->
  <rect x="24" y="24" width="150" height="150" rx="22" fill="#2a6fdb"/>
  <text x="99" y="112" text-anchor="middle" font-size="46" fill="#fff">⬇</text>
  <text x="99" y="196" text-anchor="middle" font-size="14" fill="#222">Yoinker</text>
  <rect x="150" y="60" width="190" height="112" rx="8" fill="#fff" stroke="#bbb" filter="drop-shadow(0 2px 4px #0003)"/>
  <rect x="156" y="68" width="178" height="26" rx="5" fill="#2a6fdb"/>
  <text x="166" y="86" font-size="14" fill="#fff" font-weight="bold">Megnyitás</text>
  <text x="166" y="118" font-size="14" fill="#333">Kuka</text>
  <text x="166" y="142" font-size="14" fill="#333">Információ</text>
  <text x="166" y="166" font-size="14" fill="#333">Átnevezés</text>
  <circle cx="352" cy="81" r="16" fill="#ffd400"/><text x="352" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">1</text>
  <text x="24" y="232" font-size="13" fill="#444">Jobb klikk (vagy Control + kattintás) a Yoinkeren → Megnyitás</text>

  <!-- step 2: dialog -->
  <rect x="200" y="250" width="340" height="150" rx="12" fill="#fff" stroke="#ccc"/>
  <text x="370" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Az Apple nem tudja ellenőrizni, hogy a „Yoinker”</text>
  <text x="370" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">nem tartalmaz-e kártékony szoftvert.</text>
  <text x="370" y="324" text-anchor="middle" font-size="12" fill="#555">Biztosan meg szeretnéd nyitni?</text>
  <rect x="236" y="350" width="120" height="32" rx="6" fill="#2a6fdb"/>
  <text x="296" y="371" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Megnyitás</text>
  <rect x="230" y="344" width="132" height="44" rx="8" fill="none" stroke="#ffd400" stroke-width="3"/>
  <circle cx="382" cy="366" r="16" fill="#ffd400"/><text x="382" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">2</text>
  <rect x="404" y="350" width="110" height="32" rx="6" fill="#e9e9e9"/>
  <text x="459" y="371" text-anchor="middle" font-size="14" fill="#222">Mégse</text>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#777">Illusztráció – csak az első megnyitáskor kell</text>
</svg>
